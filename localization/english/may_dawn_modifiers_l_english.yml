l_english:
  modifier_post_war_reality: "Post-War Reality"
  modifier_post_war_reality_desc: "The echoes of the Great War still haunt our streets. With a significant portion of the workforce lost and the infrastructure in ruins, the nation must endure a long and painful process of reconstruction while facing deep social unrest."
  polish_empire_modifier: "Polish supremacy"
  polish_empire_modifier_desc: "The state focuses on Polonization and centralized authority, building a unified imperial nation."
  plrc_modifier: "Spirit of the Warsaw Confederation"
  plrc_modifier_desc: "Multi-ethnic peace and religious tolerance are the foundations of our strength."

  plc_serfdom_tension_modifier: "Rural Tension"
  plc_serfdom_tension_modifier_desc: "The landowners resent every talk of reform, while the peasantry resents every day reform is delayed. Neither side trusts the Crown to keep its word."
  plc_serfdom_resolved_modifier: "Countryside at Peace"
  plc_serfdom_resolved_modifier_desc: "Rural reform came in time. The peasantry sees the state as an ally rather than an enemy."
  plc_serfdom_reform_modifier: "Emergency Land Reform"
  plc_serfdom_reform_modifier_desc: "A hasty reform of rural relations has calmed the countryside, at the cost of the landowners' goodwill."
  plc_serfdom_repression_modifier: "Uneasy Calm"
  plc_serfdom_repression_modifier_desc: "The army has restored order in the countryside, but the peasantry's grievances remain unaddressed and fester beneath the surface."
  plc_rabacja_scars_modifier: "The Nobility's Triumph"
  plc_rabacja_scars_modifier_desc: "The revolt was crushed in blood. The nobility feels vindicated and loyal to the Crown; the peasantry has been broken and resentful, for now."
  plc_peasants_triumph_modifier: "The Peasants' Triumph"
  plc_peasants_triumph_modifier_desc: "Serfdom was abolished under the shadow of revolt. The peasantry is emboldened and loyal; the nobility humiliated and radicalized."
  plc_serfdom_compromise_modifier: "Fragile Compromise"
  plc_serfdom_compromise_modifier_desc: "The dispute was settled at the negotiating table. No one got what they wanted, but no one died either."
