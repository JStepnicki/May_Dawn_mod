l_polish:
  modifier_post_war_reality: "Powojenna Rzeczywistość"
  modifier_post_war_reality_desc: "Echa wielkiej wojny wciąż nawiedzają nasze ulice. Przy znacznej utracie siły roboczej i zniszczonej infrastrukturze, naród musi przetrwać długi i bolesny proces odbudowy, mierząc się jednocześnie z głębokimi niepokojami społecznymi."
  polish_empire_modifier: "Polska dominacja"
  polish_empire_modifier_desc: "Państwo stawia na polonizację i centralną władzę, budując jednolity naród imperialny."
  plrc_modifier: "Duch Konfederacji Warszawskiej"
  plrc_modifier_desc: "Wieloetniczny pokój i tolerancja religijna są fundamentami naszej potęgi."

  plc_serfdom_tension_modifier: "Napięcie na Wsi"
  plc_serfdom_tension_modifier_desc: "Ziemiaństwo z niechęcią patrzy na każdą wzmiankę o reformie, a chłopstwo z narastającym gniewem liczy każdy dzień zwłoki. Żadna ze stron nie ufa już, że Korona dotrzyma słowa."
  plc_serfdom_resolved_modifier: "Wieś w Spokoju"
  plc_serfdom_resolved_modifier_desc: "Reforma wsi nadeszła na czas. Chłopstwo widzi w państwie sojusznika, a nie wroga."
  plc_serfdom_reform_modifier: "Doraźna Reforma Rolna"
  plc_serfdom_reform_modifier_desc: "Pospieszna reforma stosunków wiejskich uspokoiła wieś kosztem przychylności ziemiaństwa."
  plc_serfdom_repression_modifier: "Niepewny Spokój"
  plc_serfdom_repression_modifier_desc: "Wojsko przywróciło porządek na wsi, lecz krzywdy chłopstwa pozostały nierozwiązane i tlą się pod powierzchnią."
  plc_rabacja_scars_modifier: "Triumf Szlachty"
  plc_rabacja_scars_modifier_desc: "Bunt stłumiono krwią. Szlachta czuje się usprawiedliwiona i lojalna wobec Korony; chłopstwo zostało złamane i pełne urazy - na razie."
  plc_peasants_triumph_modifier: "Triumf Chłopstwa"
  plc_peasants_triumph_modifier_desc: "Pańszczyznę zniesiono w cieniu buntu. Chłopstwo czuje się umocnione i lojalne; szlachta upokorzona i zradykalizowana."
  plc_serfdom_compromise_modifier: "Kruchy Kompromis"
  plc_serfdom_compromise_modifier_desc: "Spór rozwiązano przy stole negocjacyjnym. Nikt nie dostał tego, czego chciał, ale nikt też nie zginął."